<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Roller Splash · Stardust</title>
  <style>
    /* ----- RESET & ROOT ----- */
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0d15;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; height: -webkit-fill-available;
      overflow: hidden; margin: 0;
      color: #fff;
    }
    /* glassmorphism card base */
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    /* ----- APP SHELL (mobile-first) ----- */
    #app {
      width: 100%; height: 100%;
      max-width: 480px; max-height: 900px;
      background: #13161f;
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
      display: flex; flex-direction: column;
    }
    /* ----- MAIN MENU (HOME) ----- */
    #menu-screen {
      display: flex; flex-direction: column;
      height: 100%; width: 100%;
      padding: 24px 20px 20px;
      background: radial-gradient(circle at 20% 20%, #1e2538, #0b0d15 90%);
      position: relative;
      overflow-y: auto;
    }
    .menu-bg-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .menu-bg-particles span {
      position: absolute; width: 6px; height: 6px; background: #ffd966;
      border-radius: 50%; opacity: 0.2; animation: floatParticle 18s infinite linear;
    }
    @keyframes floatParticle {
      0% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { opacity: 0.6; transform: translateY(-80px) scale(1.8); }
      100% { transform: translateY(0) scale(1); opacity: 0.2; }
    }
    .menu-header { display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .logo { font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(255,215,0,0.2); }
    .profile-badge { background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 60px; font-size: 0.8rem; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; }
    .profile-badge .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ffa502; }
    .resources { display: flex; gap: 18px; margin-top: 12px; z-index: 2; flex-wrap: wrap; }
    .resource-item { background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 40px; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.04); }
    .resource-item .icon { font-size: 1.2rem; }
    .xp-bar { margin-top: 12px; height: 8px; background: rgba(255,255,255,0.08); border-radius: 20px; overflow: hidden; z-index: 2; }
    .xp-fill { height: 100%; width: 73%; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 20px; box-shadow: 0 0 20px #ffd20055; }
    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0 16px; z-index: 2; }
    .menu-grid-item { background: rgba(255,255,255,0.04); border-radius: 20px; padding: 14px 4px; text-align: center; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
    .menu-grid-item:active { transform: scale(0.94); background: rgba(255,255,255,0.08); }
    .menu-grid-item .label { font-size: 0.6rem; opacity: 0.6; margin-top: 4px; }
    .play-btn { background: linear-gradient(135deg, #f7971e, #ffd200); border: none; border-radius: 60px; padding: 18px; font-weight: 800; font-size: 1.4rem; color: #13161f; box-shadow: 0 10px 30px rgba(255,215,0,0.3); transition: 0.15s; z-index: 2; margin-top: 8px; }
    .play-btn:active { transform: scale(0.96); }
    .world-map-preview { margin: 12px 0; border-radius: 24px; overflow: hidden; height: 100px; background: #1e2538; z-index: 2; display: flex; align-items: center; padding: 0 12px; gap: 8px; border: 1px solid rgba(255,255,255,0.04); }
    .world-dot { width: 40px; height: 40px; border-radius: 50%; background: #2f3542; flex-shrink: 0; border: 2px solid transparent; }
    .world-dot.active { border-color: #ffd200; background: #ffa502; box-shadow: 0 0 20px #ffa50277; }
    .world-dot.locked { opacity: 0.3; }
    /* ----- GAME SCREEN (canvas + hud) ----- */
    #game-screen {
      display: none; flex-direction: column; height: 100%;
      background: #0b0d15;
    }
    .game-hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.04); }
    .game-hud .level-tag { font-weight: 700; font-size: 1.2rem; }
    .game-hud .difficulty-tag { font-size: 0.7rem; opacity: 0.5; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 30px; }
    .game-hud .hud-actions { display: flex; gap: 12px; }
    .hud-btn { background: rgba(255,255,255,0.06); border: none; border-radius: 30px; padding: 6px 12px; color: #fff; font-size: 1.2rem; backdrop-filter: blur(4px); }
    #canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; }
    canvas { width: 100%; height: 100%; border-radius: 24px; background: #0f121c; box-shadow: inset 0 0 40px rgba(0,0,0,0.6); }
    .game-bottom { display: flex; justify-content: space-between; padding: 12px 20px; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,0.04); }
    .game-bottom .hint-btn { background: #ffa502; border: none; border-radius: 40px; padding: 8px 24px; font-weight: 700; color: #13161f; }
    /* ----- POPUPS / MODALS (glass) ----- */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; z-index: 99;
      opacity: 0; pointer-events: none; transition: 0.25s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-card { max-width: 320px; width: 90%; padding: 30px 24px; background: rgba(20,25,40,0.85); backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 40px 80px rgba(0,0,0,0.8); text-align: center; }
    .modal-card h2 { font-weight: 700; margin-bottom: 8px; }
    .modal-card .sub { opacity: 0.6; font-size: 0.9rem; }
    .modal-card .btn-primary { background: #ffd200; color: #13161f; border: none; padding: 14px 32px; border-radius: 60px; font-weight: 800; margin-top: 20px; width: 100%; }
    /* ----- SCROLLBAR ----- */
    ::-webkit-scrollbar { width: 0; }
    /* animations */
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.3s ease both; }
  </style>
</head>
<body>
<div id="app">
  <!-- MENU SCREEN -->
  <div id="menu-screen">
    <div class="menu-bg-particles"><span style="left:10%;top:20%;animation-duration:22s;"></span><span style="left:70%;top:60%;animation-duration:28s;"></span><span style="left:40%;top:80%;animation-duration:18s;"></span><span style="left:90%;top:10%;animation-duration:32s;"></span></div>
    <div class="menu-header">
      <div class="logo">✦ Roller Splash</div>
      <div class="profile-badge"><span class="avatar"></span> Zishan</div>
    </div>
    <div class="resources">
      <div class="resource-item"><span class="icon">🪙</span> 1.2k</div>
      <div class="resource-item"><span class="icon">💎</span> 82</div>
      <div class="resource-item"><span class="icon">⚡</span> 5/8</div>
    </div>
    <div class="xp-bar"><div class="xp-fill"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:0.7rem;opacity:0.5;z-index:2;"><span>LVL 14</span><span>XP 1840 / 2500</span></div>

    <div class="menu-grid">
      <div class="menu-grid-item">🏆<div class="label">Achieve</div></div>
      <div class="menu-grid-item">📊<div class="label">Stats</div></div>
      <div class="menu-grid-item">🎯<div class="label">Events</div></div>
      <div class="menu-grid-item">🏪<div class="label">Shop</div></div>
      <div class="menu-grid-item">📜<div class="label">Pass</div></div>
      <div class="menu-grid-item">🎨<div class="label">Custom</div></div>
      <div class="menu-grid-item">🌍<div class="label">World</div></div>
      <div class="menu-grid-item">⚙️<div class="label">Settings</div></div>
    </div>

    <button class="play-btn" id="playBtn">▶  CONTINUE</button>

    <div class="world-map-preview">
      <div class="world-dot active"></div><div class="world-dot active"></div><div class="world-dot active"></div><div class="world-dot"></div><div class="world-dot locked"></div><div class="world-dot locked"></div>
      <span style="font-size:0.6rem;opacity:0.4;margin-left:auto;">World 2</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;z-index:2;flex-wrap:wrap;">
      <span style="background:rgba(255,255,255,0.04);padding:4px 14px;border-radius:30px;font-size:0.7rem;">⭐ Daily reward</span>
      <span style="background:rgba(255,255,255,0.04);padding:4px 14px;border-radius:30px;font-size:0.7rem;">🔥 5x combo</span>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <div class="game-hud">
      <div><span class="level-tag">Level 4</span> <span class="difficulty-tag">NORMAL</span></div>
      <div class="hud-actions">
        <button class="hud-btn" id="backMenuBtn">✕</button>
        <button class="hud-btn" id="refreshBtn">⟳</button>
      </div>
    </div>
    <div id="canvas-container"><canvas id="gameCanvas"></canvas></div>
    <div class="game-bottom">
      <button class="hud-btn" id="hintBtn">💡 Hint</button>
      <button class="hud-btn" id="musicToggle">🔊</button>
      <button class="hud-btn" id="sfxToggle">🔊</button>
    </div>
  </div>

  <!-- MODAL (win / perfect) -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h2>✨ PERFECT!</h2>
      <div class="sub">+100 XP · +20 coins</div>
      <button class="btn-primary" id="nextLevelBtn">NEXT LEVEL</button>
    </div>
  </div>
</div>
<script>
  // ----- PREMIUM GAME ENGINE (Roller Splash Pro) -----
  (function(){
    "use strict";
    // DOM refs
    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const winModal = document.getElementById('winModal');
    const nextBtn = document.getElementById('nextLevelBtn');
    const backBtn = document.getElementById('backMenuBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const hintBtn = document.getElementById('hintBtn');
    const playBtn = document.getElementById('playBtn');
    const musicToggle = document.getElementById('musicToggle');
    const sfxToggle = document.getElementById('sfxToggle');
    let isMusicOn = true, isSfxOn = true;

    // ----- AUDIO ENGINE (Web Audio) -----
    let audioCtx = null;
    function initAudio() { if(!audioCtx) { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }
    function playTone(freq, dur, vol=0.15, type='sine') {
      if(!audioCtx || !isSfxOn) return;
      try { const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); } catch(e){}
    }
    function playSwipe() { playTone(420, 0.08, 0.12, 'triangle'); }
    function playWin() { playTone(523, 0.12); setTimeout(()=>playTone(659,0.12),130); setTimeout(()=>playTone(784,0.18),260); }

    // ----- CORE GAME STATE -----
    let rows=8, cols=8, tileSize=0;
    let grid = [];
    let ball = { x:1, y:1, rx:1, ry:1, moving:false, tx:1, ty:1 };
    let paintColor = '#ffa502';
    const colors = ['#ff4757','#2ed573','#1e90ff','#ffa502','#9b59b6','#ff6b81','#f1c40f'];
    let particles = [];
    let hintDir = null;
    let pulse = 0;

    // ----- MAZE GENERATION (procedural) -----
    function generateMaze(diff='normal') {
      const sizeMap = { easy:6, normal:8, hard:10, expert:12 };
      const size = sizeMap[diff] || 8;
      rows=size; cols=size;
      // resize canvas
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth * 0.94;
      const h = container.clientHeight * 0.94;
      const side = Math.min(w, h, 480);
      canvas.width = side; canvas.height = side;
      tileSize = side / cols;

      let attempts=0; let ok=false;
      while(!ok && attempts<2000) {
        attempts++;
        grid = Array.from({length:rows}, ()=>Array(cols).fill(0));
        // borders
        for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(r===0||r===rows-1||c===0||c===cols-1) grid[r][c]=1;
        // random walls
        const wallCount = diff==='easy'?3: diff==='normal'?6: diff==='hard'?10:14;
        for(let i=0;i<wallCount;i++){ let rx=1+Math.floor(Math.random()*(cols-2)); let ry=1+Math.floor(Math.random()*(rows-2)); if(rx===1&&ry===1) continue; grid[ry][rx]=1; }
        // check connectivity (simple BFS)
        const visited=Array.from({length:rows},()=>Array(cols).fill(false));
        const q=[]; visited[1][1]=true; q.push([1,1]);
        const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
        while(q.length){ const [cx,cy]=q.shift(); for(const [dx,dy] of dirs){ let nx=cx+dx, ny=cy+dy; while(nx>=0&&nx<cols&&ny>=0&&ny<rows&&grid[ny][nx]!==1){ if(!visited[ny][nx]){visited[ny][nx]=true; q.push([nx,ny]);} nx+=dx; ny+=dy; } } }
        let all=true; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]===0 && !visited[r][c]) all=false;
        if(all) ok=true;
      }
      // reset ball
      ball.x=1; ball.y=1; ball.rx=1; ball.ry=1; ball.moving=false; ball.tx=1; ball.ty=1;
      grid[1][1]=2; // painted start
      hintDir=null; particles=[];
      pickRandomColor();
    }

    function pickRandomColor() { paintColor = colors[Math.floor(Math.random()*colors.length)]; }

    // ----- MOVE LOGIC (slide) -----
    function tryMove(dx, dy) {
      if(ball.moving) return;
      let nx=ball.x, ny=ball.y;
      while(nx+dx>=0 && nx+dx<cols && ny+dy>=0 && ny+dy<rows && grid[ny+dy][nx+dx]!==1) { nx+=dx; ny+=dy; }
      if(nx===ball.x && ny===ball.y) return;
      ball.moving=true; ball.tx=nx; ball.ty=ny;
      playSwipe();
      // animate
      function step() {
        const speed=0.85;
        let done=true;
        if(Math.abs(ball.rx-ball.tx)>0.01){ ball.rx += Math.sign(ball.tx-ball.rx)*speed; done=false; }
        if(Math.abs(ball.ry-ball.ty)>0.01){ ball.ry += Math.sign(ball.ty-ball.ry)*speed; done=false; }
        if(!done) { requestAnimationFrame(step); return; }
        ball.rx=ball.tx; ball.ry=ball.ty; ball.x=ball.tx; ball.y=ball.ty; ball.moving=false;
        // paint path
        let cx=ball.x, cy=ball.y;
        // paint from start to end (simulate)
        let sx=ball.x, sy=ball.y;
        // we need to paint all cells along the slide
        let px=ball.x-dx, py=ball.y-dy;
        while(px>=0&&px<cols&&py>=0&&py<rows&&grid[py][px]!==1){
          if(grid[py][px]===0) grid[py][px]=2;
          px-=dx; py-=dy;
        }
        if(grid[ball.y][ball.x]===0) grid[ball.y][ball.x]=2;
        checkWin();
      }
      step();
    }

    function checkWin() {
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]===0) return;
      // WIN
      playWin();
      winModal.classList.add('show');
    }

    // ----- HINT (BFS solver) -----
    function getHint() {
      if(ball.moving) return null;
      // simple BFS to find a move that leads to full coverage
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(const [dx,dy] of dirs) {
        let nx=ball.x, ny=ball.y;
        let testGrid=grid.map(r=>[...r]);
        while(nx+dx>=0&&nx+dx<cols&&ny+dy>=0&&ny+dy<rows&&testGrid[ny+dy][nx+dx]!==1){
          nx+=dx; ny+=dy;
          if(testGrid[ny][nx]===0) testGrid[ny][nx]=2;
        }
        if(nx!==ball.x || ny!==ball.y) {
          // check if this move leads to win (quick)
          let all=true;
          for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(testGrid[r][c]===0) all=false;
          if(all) return [dx,dy];
        }
      }
      // fallback: any adjacent unpainted
      for(const [dx,dy] of dirs) {
        let nx=ball.x+dx, ny=ball.y+dy;
        if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&grid[ny][nx]===0) return [dx,dy];
      }
      return null;
    }

    // ----- RENDER LOOP (premium) -----
    function render() {
      pulse += 0.02;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // draw grid
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
        const val = grid[r][c];
        const x=c*tileSize, y=r*tileSize;
        if(val===1) { // wall
          ctx.fillStyle = '#2f3542';
          ctx.shadowBlur=0;
          ctx.fillRect(x,y,tileSize+0.5,tileSize+0.5);
          continue;
        }
        if(val===2) { // painted
          const grad = ctx.createRadialGradient(x+tileSize/2, y+tileSize/2, 2, x+tileSize/2, y+tileSize/2, tileSize*0.8);
          grad.addColorStop(0, paintColor);
          grad.addColorStop(1, '#1a1d2b');
          ctx.fillStyle = grad;
        } else { // unpainted
          ctx.fillStyle = '#171b29';
        }
        ctx.shadowBlur=4; ctx.shadowColor='rgba(0,0,0,0.3)';
        ctx.fillRect(x,y,tileSize+0.5,tileSize+0.5);
      }
      // particles
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i]; p.alpha-=0.02; p.size*=0.99;
        if(p.alpha<=0){ particles.splice(i,1); continue; }
        ctx.globalAlpha=p.alpha; ctx.fillStyle=paintColor; ctx.shadowBlur=20; ctx.shadowColor=paintColor+'66';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      // ball
      const bx=ball.rx*tileSize+tileSize/2, by=ball.ry*tileSize+tileSize/2;
      const rad=tileSize*0.38;
      // glow
      ctx.shadowBlur=30; ctx.shadowColor='#fff4';
      ctx.beginPath(); ctx.arc(bx,by,rad,0,Math.PI*2);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.shadowBlur=0;
      // reflection
      ctx.beginPath(); ctx.arc(bx-3,by-4,rad*0.25,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fill();

      // hint arrow
      if(hintDir && !ball.moving){
        const [hdx,hdy]=hintDir;
        let angle=0; if(hdx===1) angle=0; if(hdx===-1) angle=Math.PI; if(hdy===1) angle=Math.PI/2; if(hdy===-1) angle=-Math.PI/2;
        ctx.save(); ctx.translate(bx,by); ctx.rotate(angle);
        const bounce = Math.sin(pulse*3)*tileSize*0.12;
        ctx.translate(bounce+tileSize*0.6,0);
        ctx.fillStyle='#ffa502'; ctx.shadowBlur=30; ctx.shadowColor='#ffa50288';
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-tileSize*0.4,-tileSize*0.3); ctx.lineTo(-tileSize*0.4,tileSize*0.3); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(render);
    }

    // ----- UI BINDINGS -----
    function startGame() {
      menuScreen.style.display='none'; gameScreen.style.display='flex';
      generateMaze('normal');
      render();
    }
    function backToMenu() {
      gameScreen.style.display='none'; menuScreen.style.display='flex';
      winModal.classList.remove('show');
    }
    playBtn.onclick = ()=>{ initAudio(); startGame(); };
    backBtn.onclick = backToMenu;
    refreshBtn.onclick = ()=>{ if(!ball.moving){ generateMaze('normal'); } };
    hintBtn.onclick = ()=>{ const h=getHint(); if(h) hintDir=h; };
    nextBtn.onclick = ()=>{ winModal.classList.remove('show'); generateMaze('normal'); };
    musicToggle.onclick = ()=>{ isMusicOn=!isMusicOn; musicToggle.textContent=isMusicOn?'🔊':'🔇'; };
    sfxToggle.onclick = ()=>{ isSfxOn=!isSfxOn; sfxToggle.textContent=isSfxOn?'🔊':'🔇'; };
    // touch / mouse drag
    let dragX=0, dragY=0, isDragging=false;
    const handleStart=(e)=>{ const p=e.touches?e.touches[0]:e; dragX=p.clientX; dragY=p.clientY; isDragging=true; };
    const handleMove=(e)=>{ if(!isDragging || ball.moving) return; const p=e.touches?e.touches[0]:e; const dx=p.clientX-dragX; const dy=p.clientY-dragY; if(Math.abs(dx)>20||Math.abs(dy)>20){ if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1); dragX=p.clientX; dragY=p.clientY; } };
    const handleEnd=()=>{ isDragging=false; };
    canvas.addEventListener('touchstart', handleStart); canvas.addEventListener('touchmove', handleMove); canvas.addEventListener('touchend', handleEnd);
    canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('mouseup', handleEnd);
    // keyboard
    document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowRight') tryMove(1,0); if(e.key==='ArrowLeft') tryMove(-1,0); if(e.key==='ArrowDown') tryMove(0,1); if(e.key==='ArrowUp') tryMove(0,-1); });

    // init menu visible
    menuScreen.style.display='flex'; gameScreen.style.display='none';
    // generate preview
    generateMaze('normal');
  })();
</script>
</body>
</html>
