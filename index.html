<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roller Splash Deluxe - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-theme: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(255, 255, 255, 0.12);
            --accent-green: #2ed573;
            --accent-gold: #ffa502;
            --accent-red: #ff4757;
            --accent-cyan: #00d2d3;
            --text-main: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-theme);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            touch-action: none;
            transition: background 0.5s ease;
        }

        /* --- BACKGROUND THEMES --- */
        body.theme-galaxy { background: radial-gradient(circle at center, #1b1035, #080410); }
        body.theme-neon { background: radial-gradient(circle at center, #0a192f, #020c1b); }
        body.theme-forest { background: radial-gradient(circle at center, #0f281e, #05100b); }
        body.theme-lava { background: radial-gradient(circle at center, #2b090a, #0f0203); }

        /* --- UTILITY & MODALS --- */
        .hidden { display: none !important; }
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #060709;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
            transition: opacity 0.5s ease;
        }
        .splash-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #00d2d3, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(0,210,211,0.4)); }
            100% { filter: drop-shadow(0 0 25px rgba(255,71,87,0.8)); }
        }
        .primary-btn {
            background: linear-gradient(135deg, #2ed573, #10ac84);
            color: #fff;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(46,213,115,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .primary-btn:active { transform: scale(0.95); }

        /* --- TOP DASHBOARD BAR --- */
        .dashboard-bar {
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .profile-chip {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .xp-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .xp-bar-bg {
            width: 70px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            width: 45%;
            background: var(--accent-cyan);
        }
        .stats-group {
            display: flex;
            gap: 10px;
        }
        .stat-badge {
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 0.85rem;
        }
        .stat-coins { background: rgba(255, 165, 2, 0.2); color: var(--accent-gold); border: 1px solid rgba(255, 165, 2, 0.3); }
        .stat-gems { background: rgba(0, 210, 211, 0.2); color: var(--accent-cyan); border: 1px solid rgba(0, 210, 211, 0.3); }

        /* --- MAIN UI CONTAINERS --- */
        #menu-screen, #game-screen, #shop-modal, #win-modal {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            padding: calc(10px + env(safe-area-inset-top)) 16px calc(15px + env(safe-area-inset-bottom)) 16px;
            transition: opacity 0.3s ease;
        }

        #menu-screen { justify-content: center; gap: 15px; z-index: 5; }
        
        .menu-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, #a4b0be);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .menu-btn {
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            background: var(--card-bg);
            color: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, background 0.2s;
        }
        .menu-btn:active { transform: scale(0.96); }
        .menu-btn-full { grid-column: span 2; background: linear-gradient(135deg, #ff4757, #ff6b81); border: none; }

        /* --- HUD & GAMEPLAY --- */
        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .hud-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border-glow);
        }
        .hud-btn.muted { opacity: 0.4; }

        #canvas-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- SHOP MODAL --- */
        #shop-modal {
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(20px);
            z-index: 20;
            justify-content: flex-start;
            padding-top: 40px;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 20px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            overflow-y: auto;
            max-height: 70vh;
            padding-bottom: 20px;
        }
        .shop-card {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-radius: 16px;
            cursor: pointer;
            position: relative;
        }
        .shop-card.active { border: 2px solid var(--accent-green); }
        .preview-ball { width: 40px; height: 40px; border-radius: 50%; }

        /* --- WIN MODAL --- */
        #win-modal {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 30;
            justify-content: center;
            align-items: center;
        }
        .win-card {
            width: 90%;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        .stars-row { display: flex; gap: 8px; }
        .star-svg { width: 40px; height: 40px; fill: #57606f; transition: fill 0.3s; }
        .star-svg.earned { fill: var(--accent-gold); filter: drop-shadow(0 0 10px var(--accent-gold)); }

        /* SHAKE & CAM EFFECTS */
        .shake { animation: camShake 0.25s ease-in-out; }
        @keyframes camShake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }
        }
    </style>
</head>

    <script>
        /* --- AUDIO ENGINE --- */
        let audioCtx = null;
        let isSfxMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx || isSfxMuted) return;
            let time = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'swipe') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, time);
                osc.frequency.exponentialRampToValueAtTime(150, time + 0.08);
                gain.gain.setValueAtTime(0.2, time);
                gain.gain.linearRampToValueAtTime(0.01, time + 0.08);
                osc.start(time); osc.stop(time + 0.08);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, time);
                osc.frequency.setValueAtTime(659.25, time + 0.1);
                osc.frequency.setValueAtTime(783.99, time + 0.2);
                gain.gain.setValueAtTime(0.3, time);
                gain.gain.linearRampToValueAtTime(0.01, time + 0.4);
                osc.start(time); osc.stop(time + 0.4);
            }
        }

        function toggleSFX() {
            isSfxMuted = !isSfxMuted;
            document.getElementById('sfx-btn').classList.toggle('muted', isSfxMuted);
        }

        function dismissSplash() {
            initAudio();
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('splash-screen').classList.add('hidden'), 500);
        }

        /* --- GAME LOGIC & STATE --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let coins = 500, gems = 25, playerLvl = 1;
        let currentDifficulty = 'EASY', currentLevel = 1, currentWorld = 1;
        let grid = [], rows = 0, cols = 0, tileSize = 0;
        let particles = [], paintSplashes = [];
        let activeSkin = 'classic';

        const paintColorsPool = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];
        let currentPaintColor = '#ff4757';
        const wallColor = '#1e272e', unpaintedPathColor = '#ffffff';

        let ball = { x: 1, y: 1, renderX: 1, renderY: 1, isMoving: false, targetX: 1, targetY: 1, rotation: 0 };
        let activeHintDir = null;
        let isTouchActive = false, touchStartX = 0, touchStartY = 0;
        let pulseTimer = 0;

        const themes = ['theme-galaxy', 'theme-neon', 'theme-forest', 'theme-lava'];
        let currentThemeIdx = 0;

        function cycleTheme() {
            document.body.className = '';
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            document.body.classList.add(themes[currentThemeIdx]);
        }

        function startMode(diff) {
            currentDifficulty = diff;
            let savedLevel = localStorage.getItem('rs_level_' + diff);
            currentLevel = savedLevel ? parseInt(savedLevel) : 1;
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            pickRandomColor();
            generateValidMaze();
            renderLoop();
        }

        function backToMenu() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function openShop() { document.getElementById('shop-modal').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shop-modal').classList.add('hidden'); }

        function selectSkin(skin, el) {
            activeSkin = skin;
            document.querySelectorAll('.shop-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function pickRandomColor() {
            currentPaintColor = paintColorsPool[Math.floor(Math.random() * paintColorsPool.length)];
        }

        function generateValidMaze() {
            currentWorld = Math.floor((currentLevel - 1) / 30) + 1;
            document.getElementById('world-level-tag').innerText = `WORLD ${currentWorld} - LVL ${currentLevel}`;
            activeHintDir = null; particles = []; paintSplashes = [];

            let size = currentDifficulty === 'EASY' ? 6 : currentDifficulty === 'MEDIUM' ? 8 : 10;
            rows = size; cols = size;

            let container = document.getElementById('canvas-container');
            let sideSize = Math.min(container.clientWidth * 0.95, container.clientHeight * 0.95);
            canvas.width = sideSize; canvas.height = sideSize;
            tileSize = canvas.width / cols;

            for (let loop = 0; loop < 3000; loop++) {
                grid = Array.from({length: rows}, () => new Array(cols).fill(0));
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        if(r === 0 || r === rows-1 || c === 0 || c === cols-1) grid[r][c] = 1;
                    }
                }
                let blockCount = currentDifficulty === 'EASY' ? 2 : currentDifficulty === 'MEDIUM' ? 5 : 9;
                for (let b = 0; b < blockCount; b++) {
                    let bx = Math.floor(Math.random() * (cols - 2)) + 1;
                    let by = Math.floor(Math.random() * (rows - 2)) + 1;
                    if(bx === 1 && by === 1) continue;
                    grid[by][bx] = 1;
                }
                if (checkSlideCoverage()) break;
            }
            ball.x = 1; ball.y = 1; ball.renderX = 1; ball.renderY = 1;
            ball.targetX = 1; ball.targetY = 1; ball.isMoving = false;
            grid[1][1] = 2;
        }

        function checkSlideCoverage() {
            let visited = Array.from({length: rows}, () => new Array(cols).fill(false));
            let painted = Array.from({length: rows}, () => new Array(cols).fill(false));
            let queue = [{x: 1, y: 1}];
            visited[1][1] = true; painted[1][1] = true;
            const vectors = [[0,-1], [0,1], [-1,0], [1,0]];

            while (queue.length > 0) {
                let curr = queue.shift();
                for (let [dx, dy] of vectors) {
                    let cx = curr.x; let cy = curr.y;
                    while (cx + dx >= 0 && cx + dx < cols && cy + dy >= 0 && cy + dy < rows && grid[cy + dy][cx + dx] !== 1) {
                        cx += dx; cy += dy;
                        painted[cy][cx] = true;
                    }
                    if (!visited[cy][cx]) {
                        visited[cy][cx] = true;
                        queue.push({x: cx, y: cy});
                    }
                }
            }
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 0 && !painted[r][c]) return false;
                }
            }
            return true;
        }

        function refreshCurrentLevel() {
            if (ball.isMoving) return;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 2) grid[r][c] = 0;
                }
            }
            ball.x = 1; ball.y = 1; ball.renderX = 1; ball.renderY = 1;
            grid[1][1] = 2;
        }

        function spawnParticles(px, py) {
            for(let i=0; i<4; i++) {
                particles.push({
                    x: px * tileSize + tileSize/2, y: py * tileSize + tileSize/2,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    size: (Math.random() * 5) + 3, alpha: 1, decay: 0.04
                });
            }
        }

        function renderLoop() {
            pulseTimer += 0.1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // GRID & PAINT DRAWING
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 1) {
                        ctx.fillStyle = wallColor;
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize + 0.5, tileSize + 0.5);
                    } else {
                        ctx.fillStyle = (grid[r][c] === 2) ? currentPaintColor : unpaintedPathColor;
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize + 0.5, tileSize + 0.5);
                    }
                }
            }

            // PARTICLES
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if(p.alpha <= 0) particles.splice(i, 1);
                else {
                    ctx.save(); ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = currentPaintColor; ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }

            // PAINTING MOVEMENT
            if (ball.isMoving) {
                ball.rotation += 0.2;
                spawnParticles(ball.renderX, ball.renderY);
                let checkR = Math.round(ball.renderY);
                let checkC = Math.round(ball.renderX);
                if (checkR >= 0 && checkR < rows && checkC >= 0 && checkC < cols) {
                    if (grid[checkR][checkC] === 0) grid[checkR][checkC] = 2;
                }
            }

            // FLOATING HINT OVERLAY
            if (activeHintDir && !ball.isMoving) {
                ctx.save();
                ctx.translate(ball.x * tileSize + tileSize / 2, ball.y * tileSize + tileSize / 2);
                let angle = activeHintDir.dx === 1 ? 0 : activeHintDir.dx === -1 ? Math.PI : activeHintDir.dy === 1 ? Math.PI/2 : -Math.PI/2;
                ctx.rotate(angle);
                ctx.translate(Math.sin(pulseTimer) * 5, 0);
                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.moveTo(tileSize * 0.4, 0); ctx.lineTo(-tileSize * 0.1, -tileSize * 0.25);
                ctx.lineTo(0, 0); ctx.lineTo(-tileSize * 0.1, tileSize * 0.25); ctx.fill();
                ctx.restore();
            }

            // PREMIUM BALL RENDERING
            ctx.save();
            let bx = ball.renderX * tileSize + tileSize/2;
            let by = ball.renderY * tileSize + tileSize/2;
            let radius = tileSize * 0.38;

            ctx.translate(bx, by);
            ctx.rotate(ball.rotation);

            // Ball Shadow
            ctx.beginPath();
            ctx.arc(2, 4, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();

            // Ball Body Gradient
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius);
            
            if (activeSkin === 'neon') { grad.addColorStop(0, '#00d2d3'); grad.addColorStop(1, '#01a3a4'); }
            else if (activeSkin === 'lava') { grad.addColorStop(0, '#ff4757'); grad.addColorStop(1, '#ff6b81'); }
            else if (activeSkin === 'gold') { grad.addColorStop(0, '#ffa502'); grad.addColorStop(1, '#eccc68'); }
            else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#a4b0be'); }

            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(renderLoop);
        }

        function moveBall(dx, dy) {
            if (ball.isMoving) return;
            activeHintDir = null;

            let nextX = ball.x; let nextY = ball.y;
            while (nextX + dx >= 0 && nextX + dx < cols && nextY + dy >= 0 && nextY + dy < rows && grid[nextY + dy][nextX + dx] !== 1) {
                nextX += dx; nextY += dy;
            }

            if (nextX !== ball.x || nextY !== ball.y) {
                ball.isMoving = true;
                ball.targetX = nextX; ball.targetY = nextY;
                playSound('swipe');

                let velocity = 0.85;
                function animate() {
                    let arrived = true;
                    if (ball.renderX !== ball.targetX) {
                        let diff = ball.targetX - ball.renderX;
                        if (Math.abs(diff) <= velocity) ball.renderX = ball.targetX;
                        else ball.renderX += Math.sign(diff) * velocity;
                        arrived = false;
                    }
                    if (ball.renderY !== ball.targetY) {
                        let diff = ball.targetY - ball.renderY;
                        if (Math.abs(diff) <= velocity) ball.renderY = ball.targetY;
                        else ball.renderY += Math.sign(diff) * velocity;
                        arrived = false;
                    }
                    if (arrived) {
                        ball.x = ball.targetX; ball.y = ball.targetY;
                        ball.isMoving = false;
                        checkWinCondition();
                    } else requestAnimationFrame(animate);
                }
                animate();
            }
        }

        /* --- BFS AI HINT SOLVER --- */
        function triggerHintArrow() {
            if (ball.isMoving) return;

            function getSerializedState(bx, by, gState) {
                return `${bx},${by},` + gState.map(r => r.join('')).join('|');
            }
            function isFullyPainted(gState) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (gState[r][c] === 0) return false;
                    }
                }
                return true;
            }

            const vectors = [{dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1}];
            let queue = []; let visitedStates = new Set();

            for (let v of vectors) {
                let nx = ball.x; let ny = ball.y;
                let clonedGrid = grid.map(r => [...r]);
                while (nx + v.dx >= 0 && nx + v.dx < cols && ny + v.dy >= 0 && ny + v.dy < rows && clonedGrid[ny + v.dy][nx + v.dx] !== 1) {
                    nx += v.dx; ny += v.dy;
                    if (clonedGrid[ny][nx] === 0) clonedGrid[ny][nx] = 2;
                }
                if (nx !== ball.x || ny !== ball.y) {
                    let sKey = getSerializedState(nx, ny, clonedGrid);
                    queue.push({ x: nx, y: ny, grid: clonedGrid, firstMove: v });
                    visitedStates.add(sKey);
                }
            }

            let safetyCounter = 0;
            while (queue.length > 0 && safetyCounter < 3000) {
                safetyCounter++;
                let curr = queue.shift();
                if (isFullyPainted(curr.grid)) { activeHintDir = curr.firstMove; return; }

                for (let v of vectors) {
                    let nx = curr.x; let ny = curr.y;
                    let clonedGrid = curr.grid.map(r => [...r]);
                    while (nx + v.dx >= 0 && nx + v.dx < cols && ny + v.dy >= 0 && ny + v.dy < rows && clonedGrid[ny + v.dy][nx + v.dx] !== 1) {
                        nx += v.dx; ny += v.dy;
                        if (clonedGrid[ny][nx] === 0) clonedGrid[ny][nx] = 2;
                    }
                    if (nx !== curr.x || ny !== curr.y) {
                        let sKey = getSerializedState(nx, ny, clonedGrid);
                        if (!visitedStates.has(sKey)) {
                            visitedStates.add(sKey);
                            queue.push({ x: nx, y: ny, grid: clonedGrid, firstMove: curr.firstMove });
                        }
                    }
                }
            }
        }

        function checkWinCondition() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 0) return;
                }
            }
            playSound('win');
            document.getElementById('canvas-container').classList.add('shake');
            setTimeout(() => document.getElementById('canvas-container').classList.remove('shake'), 300);

            coins += 50;
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('win-modal').classList.remove('hidden');
        }

        function nextLevel() {
            document.getElementById('win-modal').classList.add('hidden');
            currentLevel++;
            localStorage.setItem('rs_level_' + currentDifficulty, currentLevel);
            pickRandomColor();
            generateValidMaze();
        }

        /* --- TOUCH & DRAG TRACKING --- */
        function processTouch(cx, cy) {
            if (!isTouchActive || ball.isMoving) return;
            let diffX = cx - touchStartX, diffY = cy - touchStartY;
            if (Math.abs(diffX) > 16 || Math.abs(diffY) > 16) {
                if (Math.abs(diffX) > Math.abs(diffY)) moveBall(diffX > 0 ? 1 : -1, 0);
                else moveBall(0, diffY > 0 ? 1 : -1);
                touchStartX = cx; touchStartY = cy;
            }
        }

        window.addEventListener('touchstart', e => { isTouchActive = true; touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
        window.addEventListener('touchmove', e => processTouch(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', () => isTouchActive = false);
        window.addEventListener('mousedown', e => { isTouchActive = true; touchStartX = e.clientX; touchStartY = e.clientY; });
        window.addEventListener('mousemove', e => processTouch(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => isTouchActive = false);
    </script>
</body>
