<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roller Splash Pro · Stardust</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0b0e17;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; height: -webkit-fill-available; overflow: hidden;
            padding: calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom)) 0;
            color: white;
        }

        /* --- SPLASH --- */
        #splash-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle at 30% 40%, #19222e, #070a10);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.6s ease;
        }
        .splash-logo { font-size: 3.2rem; font-weight: 900; background: linear-gradient(135deg, #f9d423, #ff4e50); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(255,78,80,0.3); }
        .splash-sub { font-size: 1rem; color: #aab; letter-spacing: 8px; margin: 16px 0 40px; }
        .start-btn { background: #2ed573; border: none; padding: 18px 64px; border-radius: 60px; font-weight: 900; font-size: 1.4rem; color: #fff; box-shadow: 0 12px 30px rgba(46,213,115,0.4); transition: .15s; cursor: pointer; }
        .start-btn:active { transform: scale(0.94); }
        .creator-tag { position: absolute; bottom: 30px; color: #4a5568; font-weight: 700; letter-spacing: 2px; font-size: 0.8rem; }

        /* --- MENU (modern) --- */
        #menu-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; position: absolute; top:0; left:0;
            padding: 20px; opacity: 1; pointer-events: auto; transition: .3s;
            background: radial-gradient(circle at 20% 30%, #151e2a, #080b12);
        }
        .menu-card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); border-radius: 48px; padding: 30px 24px;
            width: 94%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .avatar { width: 56px; height: 56px; border-radius: 30px; background: linear-gradient(135deg, #f7971e, #ffd200); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.8rem; color: #1a1f2b; }
        .player-info { flex:1; }
        .player-name { font-weight: 800; font-size: 1.2rem; }
        .xp-bar { height: 8px; background: #2a3340; border-radius: 10px; margin: 6px 0; overflow: hidden; }
        .xp-fill { height: 100%; width: 67%; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 10px; }
        .stats { display: flex; gap: 16px; font-weight: 700; color: #cbd5e0; font-size: 0.9rem; }
        .stats span { display: flex; align-items: center; gap: 4px; }
        .menu-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 24px 0; }
        .menu-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.04); color: white; padding: 14px 10px; border-radius: 30px; font-weight: 800; font-size: 0.9rem; flex: 1 0 40%; cursor: pointer; transition: .1s; backdrop-filter: blur(4px); }
        .menu-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.12); }
        .play-btn { background: #2ed573; border: none; padding: 18px; border-radius: 60px; font-weight: 900; font-size: 1.2rem; width: 100%; color: #fff; margin: 8px 0; box-shadow: 0 8px 25px rgba(46,213,115,0.3); cursor: pointer; }

        /* --- GAME SCREEN --- */
        #game-screen {
            display: flex; flex-direction: column; width:100%; height:100%; position: absolute; top:0; left:0;
            padding: calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom)) 10px;
            opacity: 0; pointer-events: none; transition: .25s;
            background: radial-gradient(circle at 70% 20%, #111a26, #080b12);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width:100%; padding: 4px 2px; }
        .hud-left { display: flex; gap: 6px; align-items: center; }
        .hud-right { display: flex; gap: 6px; }
        .icon-btn { background: rgba(255,255,255,0.07); border: none; border-radius: 40px; padding: 8px 12px; color: white; font-weight: 800; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); }
        .icon-btn svg { width: 20px; height: 20px; fill: white; }
        .level-badge { font-weight: 900; font-size: 1.2rem; background: rgba(255,255,255,0.05); padding: 6px 18px; border-radius: 40px; backdrop-filter: blur(4px); }
        #canvas-container { width:100%; flex:1; display: flex; align-items: center; justify-content: center; padding: 6px 0; }
        canvas { display: block; background: #0f1620; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); width: 100%; height: auto; aspect-ratio: 1/1; }
        .bottom-game-bar { display: flex; justify-content: space-between; width:100%; padding: 8px 4px; }
        .hint-btn { background: #ffa502; border: none; border-radius: 40px; padding: 10px 24px; font-weight: 800; color: #0b0e17; box-shadow: 0 6px 20px rgba(255,165,2,0.3); cursor: pointer; }

        /* popup */
        #popup-msg { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 3rem; font-weight: 900; color: #f9d423; text-shadow: 0 0 30px rgba(249,212,35,0.3); z-index: 99; transition: .2s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
        #popup-msg.show { transform: translate(-50%, -50%) scale(1); }

        /* shop / overlay */
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity:0; pointer-events: none; transition: .25s; }
        .overlay.open { opacity:1; pointer-events: auto; }
        .overlay-card { background: #1a2330; border-radius: 48px; padding: 30px 20px; width: 92%; max-width: 380px; border:1px solid rgba(255,255,255,0.05); max-height: 80vh; overflow-y: auto; }
        .overlay-card h2 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .shop-item button { background: #2ed573; border: none; padding: 6px 18px; border-radius: 30px; font-weight: 800; color:#0b0e17; cursor: pointer; }
        .close-overlay { background: #ff4757; border: none; padding: 10px 30px; border-radius: 40px; font-weight: 800; color:white; margin-top: 20px; width:100%; cursor: pointer; }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div id="splash-screen">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div class="splash-logo">✦ STARDUST</div>
            <div class="splash-sub">ROLLER SPLASH PRO</div>
            <button class="start-btn" onclick="dismissSplash()">▶  PLAY</button>
        </div>
        <div class="creator-tag">ZISHAN · STUDIO</div>
    </div>

    <!-- MENU -->
    <div id="menu-screen">
        <div class="menu-card">
            <div class="player-row">
                <div class="avatar">⚡</div>
                <div class="player-info">
                    <div class="player-name">Roller Master</div>
                    <div class="xp-bar"><div class="xp-fill"></div></div>
                    <div class="stats"><span>🪙 <span id="coinDisplay">120</span></span><span>💎 <span id="gemDisplay">8</span></span><span>🏆 Lv.4</span></div>
                </div>
            </div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="selectDifficulty('EASY')">🌿 EASY</button>
                <button class="menu-btn" onclick="selectDifficulty('MEDIUM')">🔥 MEDIUM</button>
                <button class="menu-btn" onclick="selectDifficulty('HARD')">💀 HARD</button>
                <button class="menu-btn" onclick="openOverlay('shop')">🛒 SHOP</button>
                <button class="menu-btn" onclick="openOverlay('achievements')">🏅 ACHIEVE</button>
                <button class="menu-btn" onclick="openOverlay('daily')">📅 DAILY</button>
            </div>
            <button class="play-btn" onclick="selectDifficulty('EASY')">▶  PLAY ARENA</button>
            <div style="display:flex;gap:8px;margin-top:14px;justify-content:center;">
                <button class="icon-btn" style="background:rgba(255,255,255,0.03);" onclick="toggleMusic()">🔊</button>
                <button class="icon-btn" style="background:rgba(255,255,255,0.03);" onclick="toggleSFX()">🔉</button>
            </div>
        </div>
    </div>

    <!-- GAME -->
    <div id="game-screen">
        <div class="top-bar">
            <div class="hud-left"><button class="icon-btn" onclick="backToMenu()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button></div>
            <div class="level-badge">⚡ <span id="level-num">1</span> · <span id="difficulty-label">EASY</span></div>
            <div class="hud-right"><button class="icon-btn" onclick="refreshCurrentLevel()"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button></div>
        </div>
        <div id="canvas-container"><canvas id="gameCanvas"></canvas></div>
        <div class="bottom-game-bar">
            <button class="icon-btn" onclick="backToMenu()">✕ QUIT</button>
            <button class="hint-btn" onclick="triggerHintArrow()">💡 HINT</button>
        </div>
    </div>

    <!-- POPUP -->
    <div id="popup-msg">✦ PERFECT ✦</div>

    <!-- OVERLAY SHOP/ACHIEVE/DAILY -->
    <div id="overlay" class="overlay">
        <div class="overlay-card" id="overlayContent">
            <h2 id="overlayTitle">SHOP</h2>
            <div id="overlayBody"></div>
            <button class="close-overlay" onclick="closeOverlay()">CLOSE</button>
        </div>
    </div>

    <script>
        // ---- AUDIO ENGINE (improved) ----
        let audioCtx = null; let musicGain = null; let isMusicMuted = false; let isSfxMuted = false;
        let melodyInterval = null; let melodyStep = 0;
        const melodyNotes = [523.25, 587.33, 659.25, 783.99, 880, 987.77, 1046.5];

        function initAudio() { if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); musicGain = audioCtx.createGain(); musicGain.gain.value = 0.15; musicGain.connect(audioCtx.destination); playMelody(); } }
        function playMelody() { if(melodyInterval) clearInterval(melodyInterval); melodyInterval = setInterval(()=>{ if(!audioCtx || audioCtx.state==='suspended' || isMusicMuted) return; let osc=audioCtx.createOscillator(); let g=audioCtx.createGain(); osc.type='sine'; osc.frequency.value=melodyNotes[melodyStep%melodyNotes.length]; g.gain.setValueAtTime(0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.18); osc.connect(g); g.connect(musicGain); osc.start(); osc.stop(audioCtx.currentTime+0.2); melodyStep++; }, 340); }
        function toggleMusic() { isMusicMuted=!isMusicMuted; if(musicGain) musicGain.gain.value=isMusicMuted?0:0.15; }
        function toggleSFX() { isSfxMuted=!isSfxMuted; }
        function playSwipe() { if(!audioCtx||isSfxMuted) return; let osc=audioCtx.createOscillator(); let g=audioCtx.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(680, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime+0.08); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime+0.08); osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.09); }
        function playVictory() { if(!audioCtx||isSfxMuted) return; [523,659,784].forEach((f,i)=>{setTimeout(()=>{let o=audioCtx.createOscillator(); let g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.value=0.15; g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2);}, i*100);}); }

        function dismissSplash() { initAudio(); document.getElementById('splash-screen').style.opacity='0'; setTimeout(()=>document.getElementById('splash-screen').style.display='none', 500); }

        // ---- GAME STATE ----
        const canvas=document.getElementById('gameCanvas'); const ctx=canvas.getContext('2d');
        let currentDifficulty='EASY'; let currentLevel=1; let grid=[]; let rows=6, cols=6, tileSize=0;
        let particles=[]; let splashParticles=[]; let paintGlow=[]; let ball={x:1,y:1,rx:1,ry:1,tx:1,ty:1,moving:false};
        let activeHint=null; let pulse=0; let coinCount=120; let gemCount=8; let totalStars=0;
        let isTouch=false; let touchX=0,touchY=0; let colorPalette=['#ff4757','#2ed573','#1e90ff','#ffa502','#9b59b6','#f9d423']; let currentColor='#ff4757';
        let worldMap = { EASY:1, MEDIUM:2, HARD:3 };

        // ---- UI ----
        function updateUI() { document.getElementById('coinDisplay').innerText=coinCount; document.getElementById('gemDisplay').innerText=gemCount; }

        function selectDifficulty(d) {
            currentDifficulty=d;
            let saved=localStorage.getItem('rs_lv_'+d); currentLevel=saved?parseInt(saved):1;
            document.getElementById('menu-screen').style.opacity='0'; document.getElementById('menu-screen').style.pointerEvents='none';
            document.getElementById('game-screen').style.opacity='1'; document.getElementById('game-screen').style.pointerEvents='auto';
            document.getElementById('difficulty-label').innerText=d;
            pickColor(); generateMaze(); renderLoop();
        }

        function backToMenu() {
            document.getElementById('menu-screen').style.opacity='1'; document.getElementById('menu-screen').style.pointerEvents='auto';
            document.getElementById('game-screen').style.opacity='0'; document.getElementById('game-screen').style.pointerEvents='none';
            activeHint=null; updateUI();
        }

        function pickColor() { currentColor=colorPalette[Math.floor(Math.random()*colorPalette.length)]; }

        function generateMaze() {
            let sz=currentDifficulty==='EASY'?6:currentDifficulty==='MEDIUM'?8:10; rows=sz; cols=sz;
            let container=document.getElementById('canvas-container'); let w=container.clientWidth*0.92; let h=container.clientHeight*0.92; let size=Math.min(w,h);
            canvas.width=size; canvas.height=size; tileSize=canvas.width/cols;
            let success=false;
            for(let attempt=0; attempt<2000; attempt++){
                grid=Array.from({length:rows},()=>Array(cols).fill(0));
                for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(r===0||r===rows-1||c===0||c===cols-1) grid[r][c]=1;
                let blocks=currentDifficulty==='EASY'?2:currentDifficulty==='MEDIUM'?5:9;
                for(let b=0;b<blocks;b++){ let bx=1+Math.floor(Math.random()*(cols-2)); let by=1+Math.floor(Math.random()*(rows-2)); if(bx===1&&by===1) continue; grid[by][bx]=1; }
                if(checkReachable()){ success=true; break; }
            }
            ball={x:1,y:1,rx:1,ry:1,tx:1,ty:1,moving:false}; grid[1][1]=2; activeHint=null; particles=[]; splashParticles=[]; paintGlow=[];
            document.getElementById('level-num').innerText=currentLevel;
        }

        function checkReachable() {
            let vis=Array.from({length:rows},()=>Array(cols).fill(false)); let q=[{x:1,y:1}]; vis[1][1]=true;
            while(q.length){ let cur=q.shift(); for(let [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){ let nx=cur.x,ny=cur.y; while(nx+dx>=0&&nx+dx<cols&&ny+dy>=0&&ny+dy<rows&&grid[ny+dy][nx+dx]!==1){ nx+=dx; ny+=dy; if(!vis[ny][nx]){vis[ny][nx]=true; q.push({x:nx,y:ny});} } } }
            for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]===0 && !vis[r][c]) return false;
            return true;
        }

        function refreshCurrentLevel() { if(ball.moving) return; activeHint=null; particles=[]; splashParticles=[]; paintGlow=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]===2) grid[r][c]=0; ball.x=1;ball.y=1;ball.rx=1;ball.ry=1;ball.tx=1;ball.ty=1; grid[1][1]=2; }

        // ---- RENDER ----
        function renderLoop() {
            pulse+=0.03; ctx.clearRect(0,0,canvas.width,canvas.height);
            // BG theme gradient
            let grad=ctx.createRadialGradient(canvas.width*0.3,canvas.height*0.2,20,canvas.width*0.5,canvas.height*0.5,canvas.width*0.8);
            grad.addColorStop(0,'#1a2535'); grad.addColorStop(1,'#0b101a'); ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);

            // draw grid with glow
            for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
                let x=c*tileSize,y=r*tileSize;
                if(grid[r][c]===1){ ctx.fillStyle='#2a3344'; ctx.shadowBlur=8; ctx.shadowColor='#00000040'; ctx.fillRect(x,y,tileSize+0.5,tileSize+0.5); ctx.shadowBlur=0; }
                else {
                    let col=grid[r][c]===2?currentColor:'#18202b';
                    ctx.fillStyle=col;
                    if(grid[r][c]===2){ ctx.shadowBlur=25; ctx.shadowColor=currentColor+'80'; }
                    ctx.fillRect(x,y,tileSize+0.5,tileSize+0.5);
                    ctx.shadowBlur=0;
                    // subtle grid lines
                    ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=0.5; ctx.strokeRect(x,y,tileSize,tileSize);
                }
            }

            // paint glow particles
            for(let i=paintGlow.length-1;i>=0;i--){ let p=paintGlow[i]; p.life-=0.02; if(p.life<=0){paintGlow.splice(i,1);continue;} ctx.globalAlpha=p.life*0.3; ctx.fillStyle=currentColor; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1-p.life*0.5),0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }

            // splash particles
            for(let i=splashParticles.length-1;i>=0;i--){ let p=splashParticles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.015; if(p.life<=0){splashParticles.splice(i,1);continue;} ctx.globalAlpha=p.life; ctx.fillStyle=currentColor; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }

            // ball with glow & reflection
            let bx=ball.rx*tileSize+tileSize/2, by=ball.ry*tileSize+tileSize/2;
            ctx.shadowBlur=35; ctx.shadowColor='rgba(255,255,255,0.25)';
            let gradBall=ctx.createRadialGradient(bx-4,by-4,2,bx,by,tileSize*0.45);
            gradBall.addColorStop(0,'#ffffff'); gradBall.addColorStop(0.4,'#e8edf5'); gradBall.addColorStop(1,'#b0c0d0');
            ctx.beginPath(); ctx.arc(bx,by,tileSize*0.38,0,Math.PI*2); ctx.fillStyle=gradBall; ctx.fill();
            ctx.shadowBlur=0;
            // highlight
            ctx.beginPath(); ctx.arc(bx-5,by-5,tileSize*0.12,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fill();

            // hint arrow
            if(activeHint && !ball.moving){
                ctx.save(); let cx=ball.x*tileSize+tileSize/2, cy=ball.y*tileSize+tileSize/2;
                ctx.translate(cx,cy); let ang=0; if(activeHint.dx===1) ang=0; if(activeHint.dx===-1) ang=Math.PI; if(activeHint.dy===1) ang=Math.PI/2; if(activeHint.dy===-1) ang=-Math.PI/2; ctx.rotate(ang);
                let bounce=Math.sin(pulse*3)*tileSize*0.12; ctx.translate(bounce,0);
                ctx.fillStyle='#ffa502'; ctx.shadowBlur=25; ctx.shadowColor='#ffa50280';
                ctx.beginPath(); ctx.moveTo(tileSize*0.7,0); ctx.lineTo(-tileSize*0.1,-tileSize*0.35); ctx.lineTo(0,0); ctx.lineTo(-tileSize*0.1,tileSize*0.35); ctx.closePath(); ctx.fill();
                ctx.restore();
            }

            // moving smooth
            if(ball.moving){
                let speed=0.9;
                if(Math.abs(ball.rx-ball.tx)>0.01){ ball.rx += Math.sign(ball.tx-ball.rx)*speed; } else ball.rx=ball.tx;
                if(Math.abs(ball.ry-ball.ty)>0.01){ ball.ry += Math.sign(ball.ty-ball.ry)*speed; } else ball.ry=ball.ty;
                if(ball.rx===ball.tx && ball.ry===ball.ty){ ball.x=ball.tx; ball.y=ball.ty; ball.moving=false; checkWin(); }
            }

            requestAnimationFrame(renderLoop);
        }

        // ---- MOVE ----
        function moveBall(dx,dy){
            if(ball.moving) return; activeHint=null;
            let nx=ball.x, ny=ball.y;
            while(nx+dx>=0&&nx+dx<cols&&ny+dy>=0&&ny+dy<rows&&grid[ny+dy][nx+dx]!==1){ nx+=dx; ny+=dy; }
            if(nx===ball.x && ny===ball.y) return;
            ball.moving=true; ball.tx=nx; ball.ty=ny;
            playSwipe();
            // splash particles
            for(let i=0;i<12;i++){ splashParticles.push({ x:ball.x*tileSize+tileSize/2+ (Math.random()-0.5)*tileSize, y:ball.y*tileSize+tileSize/2+ (Math.random()-0.5)*tileSize, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3-1, r:3+Math.random()*5, life:0.8+Math.random()*0.4 }); }
            // glow
            for(let i=0;i<6;i++){ paintGlow.push({ x:ball.x*tileSize+tileSize/2+(Math.random()-0.5)*tileSize*0.6, y:ball.y*tileSize+tileSize/2+(Math.random()-0.5)*tileSize*0.6, r:tileSize*0.3+Math.random()*10, life:0.8+Math.random()*0.2 }); }
            // paint tile
            if(grid[ny][nx]===0) grid[ny][nx]=2;
        }

        function checkWin(){
            for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]===0) return;
            playVictory();
            let popup=document.getElementById('popup-msg'); popup.classList.add('show');
            coinCount += 15 + Math.floor(Math.random()*10); gemCount += 2; updateUI();
            setTimeout(()=>{ popup.classList.remove('show'); currentLevel++; localStorage.setItem('rs_lv_'+currentDifficulty,currentLevel); pickColor(); generateMaze(); }, 700);
        }

        // ---- HINT BFS ----
        function triggerHintArrow(){
            if(ball.moving) return;
            function serialize(bx,by,g){ return bx+','+by+','+g.map(r=>r.join('')).join('|'); }
            function allPainted(g){ for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(g[r][c]===0) return false; return true; }
            let dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
            let q=[]; let visited=new Set();
            for(let d of dirs){ let nx=ball.x,ny=ball.y; let g=grid.map(r=>[...r]); while(nx+d.dx>=0&&nx+d.dx<cols&&ny+d.dy>=0&&ny+d.dy<rows&&g[ny+d.dy][nx+d.dx]!==1){ nx+=d.dx; ny+=d.dy; if(g[ny][nx]===0) g[ny][nx]=2; } if(nx!==ball.x||ny!==ball.y){ let key=serialize(nx,ny,g); if(!visited.has(key)){ visited.add(key); q.push({x:nx,y:ny,grid:g,first:d}); } } }
            let safety=0; while(q.length && safety<4000){ safety++; let cur=q.shift(); if(allPainted(cur.grid)){ activeHint=cur.first; return; } for(let d of dirs){ let nx=cur.x,ny=cur.y; let g=cur.grid.map(r=>[...r]); while(nx+d.dx>=0&&nx+d.dx<cols&&ny+d.dy>=0&&ny+d.dy<rows&&g[ny+d.dy][nx+d.dx]!==1){ nx+=d.dx; ny+=d.dy; if(g[ny][nx]===0) g[ny][nx]=2; } if(nx!==cur.x||ny!==cur.y){ let key=serialize(nx,ny,g); if(!visited.has(key)){ visited.add(key); q.push({x:nx,y:ny,grid:g,first:cur.first}); } } } }
            // fallback
            for(let d of dirs){ let tx=ball.x+d.dx,ty=ball.y+d.dy; if(ty>=0&&ty<rows&&tx>=0&&tx<cols && grid[ty][tx]===0){ activeHint=d; return; } }
        }

        // ---- TOUCH / DRAG ----
        function handleTouchStart(e){ isTouch=true; let t=e.touches?e.touches[0]:e; touchX=t.clientX; touchY=t.clientY; }
        function handleTouchMove(e){ if(!isTouch||ball.moving) return; let t=e.touches?e.touches[0]:e; let dx=t.clientX-touchX, dy=t.clientY-touchY; if(Math.abs(dx)>20||Math.abs(dy)>20){ if(Math.abs(dx)>Math.abs(dy)){ moveBall(dx>0?1:-1,0); } else { moveBall(0,dy>0?1:-1); } touchX=t.clientX; touchY=t.clientY; } }
        function handleTouchEnd(){ isTouch=false; }

        window.addEventListener('touchstart', handleTouchStart, {passive:true});
        window.addEventListener('touchmove', handleTouchMove, {passive:true});
        window.addEventListener('touchend', handleTouchEnd, {passive:true});
        window.addEventListener('mousedown', handleTouchStart);
        window.addEventListener('mousemove', handleTouchMove);
        window.addEventListener('mouseup', handleTouchEnd);

        // ---- OVERLAY (Shop, Achievements, Daily) ----
        function openOverlay(type){
            let overlay=document.getElementById('overlay'); overlay.classList.add('open');
            let title=document.getElementById('overlayTitle'); let body=document.getElementById('overlayBody');
            if(type==='shop'){ title.innerText='🛒 SHOP'; body.innerHTML=`
                <div class="shop-item"><span>⚡ Neon Ball</span><button onclick="buyItem(50)">50 🪙</button></div>
                <div class="shop-item"><span>🔥 Lava Trail</span><button onclick="buyItem(80)">80 🪙</button></div>
                <div class="shop-item"><span>💎 Galaxy Theme</span><button onclick="buyItem(120)">120 🪙</button></div>
                <div class="shop-item"><span>✨ Star Burst</span><button onclick="buyItem(30)">30 🪙</button></div>
            `; }
            else if(type==='achievements'){ title.innerText='🏅 ACHIEVEMENTS'; body.innerHTML=`<div>🏆 Paint Master · 50%</div><div>⚡ Speed Runner · 30%</div><div>🌟 Legend · 10%</div><div>📦 Collector · 4/10</div>`; }
            else if(type==='daily'){ title.innerText='📅 DAILY MISSIONS'; body.innerHTML=`<div>🎯 Complete 5 levels · 0/5</div><div>💡 No Hint bonus · 0/3</div><div>⏱️ Under 40s · 0/1</div><div>🪙 Collect 200 coins · 0/200</div>`; }
        }
        function closeOverlay(){ document.getElementById('overlay').classList.remove('open'); }
        function buyItem(cost){ if(coinCount>=cost){ coinCount-=cost; updateUI(); alert('Purchased!'); } else alert('Not enough coins!'); }

        // ---- INIT ----
        updateUI();
        // start with easy
        setTimeout(()=>{ selectDifficulty('EASY'); }, 100);
    </script>
